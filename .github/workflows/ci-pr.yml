name: CI - Pull Request

# Trigger only on pull requests to main/master branches
# This workflow provides fast feedback for code review
on:
  pull_request:

# Define the jobs to run
jobs:
  ci-pr:
    name: Fast Validation
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the PR code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Bun environment
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Step 3: Install dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Step 4: Run TypeScript type checking
      - name: Run type check
        run: bun run typecheck

      # Step 5: Run ESLint to check code quality
      - name: Run linter
        run: bun run lint

      # Step 6: Run tests with coverage
      - name: Run tests with coverage
        run: bun run test:coverage

      # Step 7: Upload coverage to Codecov (PR comments)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-pr
          fail_ci_if_error: false

      # Step 8: Upload coverage artifact (for manual review)
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
