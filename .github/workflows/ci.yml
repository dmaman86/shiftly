name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: TypeCheck, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Verify runtime versions
        run: |
          node --version
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Run linter
        run: bun run lint

      - name: Test electoral calendar tooling
        run: bun run calendar:elections:test

      - name: Check formatting
        run: bun run format:check

      - name: Check README diagrams are in sync
        run: bun run docs:diagrams:check

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: ${{ github.event_name == 'pull_request' && 'codecov-pr' || 'codecov-umbrella' }}
          fail_ci_if_error: false

      - name: Upload coverage artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # apps/web/vite.config.ts sets base: '/shiftly/'. Without these secrets (e.g. fork PRs)
      # the app falls back to guest mode, so the build still succeeds.
      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Public base URL of apps/api (no trailing slash): a repository
          # variable, not a secret, since it ships in the browser bundle.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: bun run build

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist
          if-no-files-found: error

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [checks, build]
    container:
      # Keep this version aligned with the Playwright version resolved in bun.lock.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # setup-bun extracts its release ZIP; the Playwright image does not include unzip.
      - name: Install Bun setup prerequisite
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      # In CI, playwright.config.ts serves ./dist via `vite preview`,
      # so the exact artifact that gets deployed is the one under test.
      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # After the API is live and answering /health and /ready: a new web app
    # must never call an API that does not have its endpoints yet.
    needs: [checks, e2e, deploy-api]

    concurrency:
      group: pages
      cancel-in-progress: false

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-api:
    name: Deploy API to Cloud Run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [checks, e2e]

    concurrency:
      group: api-deploy
      cancel-in-progress: false

    # id-token lets the job exchange GitHub's OIDC token for short-lived Google
    # credentials (Workload Identity Federation): no Google key is stored here.
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: shiftly-app-507108
      REGION: asia-southeast1
      SERVICE: shiftly-api
      IMAGE: asia-southeast1-docker.pkg.dev/shiftly-app-507108/shiftly/api:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/684586062538/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: shiftly-api-deployer@shiftly-app-507108.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # The root .dockerignore is an allowlist, so no .env file can reach the image.
      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      # Only the image changes: env vars, secrets, scaling limits and the
      # runtime service account stay as configured on the service.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --quiet

      - name: Check liveness and readiness
        run: |
          url=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format='value(status.url)')
          curl --fail --silent --show-error --retry 3 "$url/health"
          curl --fail --silent --show-error --retry 3 "$url/ready"
