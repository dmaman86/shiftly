name: CI - Main Branch

# Trigger only on push to main/master branches
# This workflow runs comprehensive checks and generates quality metrics
on:
  push:
    branches: [main, master]

# Define the jobs to run
jobs:
  ci:
    name: TypeCheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Bun environment
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Step 3: Install dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Step 4: Run TypeScript type checking
      - name: Run type check
        run: bun run typecheck

      # Step 5: Run ESLint to check code quality
      - name: Run linter
        run: bun run lint

      # Step 6: Run tests with coverage
      - name: Run tests with coverage
        run: bun run test:coverage

      # Step 7: Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      # Step 8: Build the application
      - name: Build application
        run: bun run build
